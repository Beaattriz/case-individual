<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Painel Folia · Voluntário</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="menu">
        <a href="index.html" class="btn-link">Início</a>
        <a href="coordenacao.html" class="btn-link">Coordenação</a>
    </nav> 
    <section id="tela=voluntario" class="secao-etapa">
        <h2>Administre seu posto</h2>
        <div class="posto">
            <label for="posto">Escolha seu posto:</label>
            <select id="posto" name="posto" placeholder="Selecione" required>
                <option value="Posto 1">Posto 1</option>
                <option value="Posto 2">Posto 2</option>
                <option value="Posto 3">Posto 3</option>
                <option value="Posto 4">Posto 4</option>
                <option value="Posto 5">Posto 5</option>
                <option value="Posto 6">Posto 6</option>
                <option value="Posto 7">Posto 7</option>
                <option value="Posto 8">Posto 8</option>
                <option value="Posto 9">Posto 9</option>
                <option value="Posto 10">Posto 10</option>
            </select>
        </div>
        <div class="botoes">
            <label for="botoes">Controle de pacientes</label>
            <button type="submit"> + 1 paciente </button>
            <button type="submit"> - 1 paciente </button>
        </div>
        <div class="status">
            <label for="status">Status do posto:</label>
            <button type="submit">ABERTO</button>
            <button type="submit">FECHADO</button>
            <button type="submit">LOTADO</button>
        </div>
    </section>
</body>
</html>
