<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Painel Folia · Coordenação</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<!-- a classe "tela-coordenacao" é o que faz o script.js saber que está nesta página -->
<body class="tela-coordenacao">
    <nav class="menu">
        <a href="index.html" class="btn-link">Início</a>
        <a href="voluntario.html" class="btn-link">Voluntário</a>
    </nav>

    <main id="tela-coordenacao" class="conteudo">
        <h2>Painel da coordenação</h2>

        <!-- 1. Onde está o trio + botão Atualizar + aviso de dado antigo -->
        <section class="controles">
            <form id="form-trecho" class="form-trecho" novalidate>
                <label for="campo-trecho">O trio está no trecho</label>
                <input id="campo-trecho" name="trecho" type="number" min="1" max="10" value="1" required>
                <span id="trecho-total" class="dica"></span>
                <button type="submit" id="botao-atualizar" class="btn">Atualizar</button>
            </form>
            <p id="erro-trecho" class="mensagem mensagem--erro" hidden></p>

            <div id="frescor" class="frescor" role="status" aria-live="polite">
                <span class="frescor__ponto"></span>
                <span id="frescor-texto">Carregando…</span>
            </div>
        </section>

        <!-- 2. Posto recomendado (o mais próximo que não está lotado nem fechado) -->
        <section id="recomendado" class="recomendado recomendado--vazio" aria-live="polite">
            <p class="recomendado__rotulo">Encaminhar paciente para</p>
            <p id="recomendado-nome" class="recomendado__nome">—</p>
            <p id="recomendado-detalhe" class="recomendado__detalhe"></p>
        </section>

        <!-- 3. Lista de postos (montada pelo script.js com createElement) -->
        <section>
            <div class="lista-cabecalho">
                <h3>Postos por distância do trio</h3>
                <ul class="legenda">
                    <li><span class="bolinha bolinha--verde"></span>aberto</li>
                    <li><span class="bolinha bolinha--amarelo"></span>enchendo</li>
                    <li><span class="bolinha bolinha--vermelho"></span>lotado</li>
                    <li><span class="bolinha bolinha--cinza"></span>fechado</li>
                </ul>
            </div>
            <ol id="lista-postos" class="lista-postos"></ol>
        </section>

        <!-- 4. Cadastro de posto novo (POST /api/postos) -->
        <details class="cadastro">
            <summary>Cadastrar novo posto</summary>
            <form id="form-cadastro" class="form-cadastro" novalidate>
                <label for="campo-nome">Nome do posto</label>
                <input id="campo-nome" name="nome" type="text" minlength="3" maxlength="60" required placeholder="Ex.: Posto Rua Marquês de Leão">

                <label for="campo-posicao">Posição no circuito (metros desde o início)</label>
                <input id="campo-posicao" name="posicao_m" type="number" min="0" step="1" required placeholder="Ex.: 1800">

                <button type="submit" class="btn">Cadastrar</button>
                <p id="msg-cadastro" class="mensagem" hidden></p>
            </form>
        </details>
    </main>

    <footer class="rodape">O painel não registra dados pessoais nem clínicos: só a contagem da fila e o status de cada posto.</footer>
</body>
</html>
